
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA na Prática</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #080808;
    color: white;
    min-height: 100vh;
}

header {
    padding: 30px 20px;
    text-align: center;
    border-bottom: 1px solid #c9a448;
}

header h1 {
    color: #d8b45a;
    font-size: 32px;
    letter-spacing: 3px;
}

header p {
    color: #aaa;
    margin-top: 10px;
}

main {
    max-width: 850px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: #151515;
    border: 1px solid #9e7d32;
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 25px;
}

h2 {
    color: #d8b45a;
    margin-bottom: 18px;
}

p {
    color: #ccc;
    line-height: 1.6;
}

button {
    background: #d8b45a;
    color: #080808;
    border: none;
    padding: 14px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    background: #f1d17c;
    transform: translateY(-2px);
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.65;
    transform: none;
}

#quiz, #result {
    display: none;
}

#progress {
    color: #d8b45a;
    margin-bottom: 15px;
    font-weight: bold;
}

.progress-container {
    width: 100%;
    height: 8px;
    background: #333;
    border-radius: 20px;
    margin-bottom: 25px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #d8b45a;
    transition: 0.3s;
}

#answers {
    display: grid;
    gap: 12px;
    margin-top: 25px;
}

.answer {
    width: 100%;
    text-align: left;
    margin: 0;
    background: #242424;
    color: white;
    border: 1px solid #444;
}

.answer:hover:not(:disabled) {
    background: #383838;
}

.answer.correct {
    background: #176b3a;
    border-color: #36c878;
    color: white;
}

.answer.wrong {
    background: #8b2525;
    border-color: #e34b4b;
    color: white;
}

#feedback {
    margin-top: 20px;
    font-weight: bold;
}

#result {
    text-align: center;
}

#score {
    font-size: 25px;
    color: #d8b45a;
    margin: 20px 0;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
    border-top: 1px solid #222;
}
</style>
</head>

<body>

<header>
    <h1>IA NA PRÁTICA</h1>
    <p>Conhecimento, criatividade e inteligência artificial.</p>
</header>

<main>

<section class="card" id="home">
    <h2>Desafie seu conhecimento!</h2>

    <p>
        Teste seus conhecimentos sobre inteligência artificial,
        tecnologia e criatividade.
    </p>

    <button onclick="startQuiz()">COMEÇAR QUIZ</button>
</section>

<section class="card" id="quiz">

    <p id="progress"></p>

    <div class="progress-container">
        <div id="progressBar"></div>
    </div>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="feedback"></p>

    <button id="next" onclick="nextQuestion()" disabled>
        PRÓXIMA PERGUNTA
    </button>

</section>

<section class="card" id="result">

    <h2>QUIZ FINALIZADO!</h2>

    <p id="score"></p>

    <p id="message"></p>

    <button onclick="restartQuiz()">JOGAR NOVAMENTE</button>

</section>

</main>

<footer>
    IA na Prática © 2026
    <p>Aprender. Experimentar. Evoluir.</p>
</footer>

<script>

const questions = [

{
    question: "O que significa IA?",
    answers: [
        "Internet Automática",
        "Inteligência Artificial",
        "Informação Avançada",
        "Interface Automática"
    ],
    correct: 1
},

{
    question: "Qual é uma função da inteligência artificial?",
    answers: [
        "Ajudar a analisar informações",
        "Substituir toda a internet",
        "Criar energia do nada",
        "Desligar todos os computadores"
    ],
    correct: 0
},

{
    question: "O que é um prompt?",
    answers: [
        "Um tipo de computador",
        "Uma instrução enviada à IA",
        "Um programa antivírus",
        "Uma rede social"
    ],
    correct: 1
},

{
    question: "Qual destas ferramentas utiliza inteligência artificial?",
    answers: [
        "Calculadora comum",
        "Bloco de notas",
        "ChatGPT",
        "Teclado"
    ],
    correct: 2
},

{
    question: "A inteligência artificial pode cometer erros?",
    answers: [
        "Não, nunca",
        "Sim, pode apresentar informações incorretas",
        "Somente aos domingos",
        "Não precisa de dados"
    ],
    correct: 1
},

{
    question: "O que é um algoritmo?",
    answers: [
        "Uma sequência de instruções",
        "Um monitor",
        "Uma bateria",
        "Um aplicativo de música"
    ],
    correct: 0
},

{
    question: "Qual é uma utilização da IA na educação?",
    answers: [
        "Ajudar nos estudos",
        "Destruir livros",
        "Impedir pesquisas",
        "Desligar a escola"
    ],
    correct: 0
},

{
    question: "O que devemos fazer com informações geradas por IA?",
    answers: [
        "Acreditar em tudo",
        "Nunca ler",
        "Verificar se são confiáveis",
        "Compartilhar sem conferir"
    ],
    correct: 2
},

{
    question: "O que é aprendizado de máquina?",
    answers: [
        "Uma técnica que identifica padrões usando dados",
        "Uma máquina de lavar",
        "Um jogo eletrônico",
        "Um tipo de teclado"
    ],
    correct: 0
},

{
    question: "Qual é o objetivo do IA na Prática?",
    answers: [
        "Proibir tecnologia",
        "Explorar a inteligência artificial na prática",
        "Substituir professores",
        "Criar redes sociais"
    ],
    correct: 1
}

];

let current = 0;
let points = 0;
let answered = false;

function startQuiz() {

    current = 0;
    points = 0;

    document.getElementById("home").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    showQuestion();
}

function showQuestion() {

    answered = false;

    const q = questions[current];

    document.getElementById("progress").textContent =
        `PERGUNTA ${current + 1} DE ${questions.length}`;

    document.getElementById("progressBar").style.width =
        `${(current / questions.length) * 100}%`;

    document.getElementById("question").textContent = q.question;

    document.getElementById("feedback").textContent = "";

    document.getElementById("next").disabled = true;

    const answers = document.getElementById("answers");

    answers.innerHTML = "";

    q.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = () => checkAnswer(index, button);

        answers.appendChild(button);

    });

}

function checkAnswer(index, selected) {

    if (answered) return;

    answered = true;

    const q = questions[current];

    const buttons = document.querySelectorAll(".answer");

    buttons.forEach((button, i) => {

        button.disabled = true;

        if (i === q.correct) {
            button.classList.add("correct");
        }

    });

    if (index === q.correct) {

        points++;

        document.getElementById("feedback").textContent =
            "Resposta correta! Muito bem!";

    } else {

        selected.classList.add("wrong");

        document.getElementById("feedback").textContent =
            "Resposta incorreta! A resposta correta está em verde.";

    }

    document.getElementById("next").disabled = false;

}

function nextQuestion() {

    current++;

    if (current < questions.length) {

        showQuestion();

    } else {

        finishQuiz();

    }

}

function finishQuiz() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("progressBar").style.width = "100%";

    document.getElementById("score").textContent =
        `Você acertou ${points} de ${questions.length} perguntas!`;

    let message = "";

    if (points === 10) {

        message = "PERFEITO! Você é um mestre da IA!";

    } else if (points >= 7) {

        message = "Muito bem! Você conhece bastante sobre IA!";

    } else if (points >= 4) {

        message = "Bom trabalho! Continue aprendendo!";

    } else {

        message = "Continue estudando. O conhecimento vem com a prática!";

    }

    document.getElementById("message").textContent = message;

}

function restartQuiz() {

    document.getElementById("result").style.display = "none";

    document.getElementById("home").style.display = "block";

}

</script>

</body>
</html>
